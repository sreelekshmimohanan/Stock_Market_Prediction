{% load static %}
{% block content %}

{% include 'header.html' %}

    <div class="container mt-5">
        <h1 class="text-center">Add and Train Stock Model</h1>
        <form method="post" enctype="multipart/form-data" class="mt-4">
            {% csrf_token %}
            <div class="form-group">
                <label for="symbol">Stock Symbol:</label>
                <input type="text" name="symbol" id="symbol" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="name">Stock Name:</label>
                <input type="text" name="name" id="name" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="data_file">Upload Stock Data (CSV):</label>
                <input type="file" name="data_file" id="data_file" class="form-control" accept=".csv" required>
            </div>
            <button type="submit" class="btn btn-primary mt-3">Train and Add Stock</button>
        </form>
        {% if error %}
        <div class="alert alert-danger mt-3">{{ error }}</div>
        {% endif %}
        {% if success %}
        <div class="alert alert-success mt-3">{{ success }}</div>
        {% endif %}
    </div>

{% include 'footer.html' %}
{% endblock %}
