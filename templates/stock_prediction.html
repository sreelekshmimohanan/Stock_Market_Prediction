{% load static %}
{% block content %}

{% include 'header.html' %}

    <div class="container mt-5">
        <h1 class="text-center">Stock Price Prediction</h1>
        <form method="post" class="mt-4">
            {% csrf_token %}
            <div class="form-group">
                <label for="stock">Select Stock:</label>
                <select name="stock" id="stock" class="form-control" required>
                    <option value="">-- Select a Stock --</option>
                    {% for stock in stocks %}
                    <option value="{{ stock.id }}">{{ stock.name }} ({{ stock.symbol }})</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-primary mt-3">Predict</button>
        </form>
        {% if error %}
        <div class="alert alert-danger mt-3">{{ error }}</div>
        {% endif %}
        {% if plot %}
        <div class="mt-5">
            <h3>Prediction Results</h3>
            <p>RMSE: {{ rmse }}</p>
            <img src="data:image/png;base64,{{ plot }}" alt="Prediction Plot" class="img-fluid">
        </div>
        {% endif %}
    </div>

{% include 'footer.html' %}
{% endblock %}
